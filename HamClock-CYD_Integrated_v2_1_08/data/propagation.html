<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSK Reporter - HamClock</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --accent-primary: #3b82f6;
            --accent-secondary: #10b981;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-color: #475569;
        }
        
        body {
            background: linear-gradient(135deg, var(--bg-primary) 0%, #1e293b 100%);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        
        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        
        .info-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: var(--bg-tertiary);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 5px;
        }
        
        .stat-value {
            color: var(--accent-secondary);
            font-size: 1.5rem;
            font-weight: 700;
        }
        
        .table-container {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        
        th {
            background: var(--bg-tertiary);
            color: var(--accent-primary);
            padding: 12px 8px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid var(--accent-primary);
            position: sticky;
            top: 0;
        }
        
        td {
            padding: 10px 8px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-secondary);
        }
        
        tr:hover {
            background: rgba(59, 130, 246, 0.1);
        }
        
        .callsign {
            color: var(--accent-secondary);
            font-weight: 600;
        }
        
        .band {
            background: var(--accent-primary);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .nav-links {
            text-align: center;
            margin-top: 30px;
        }
        
        .nav-links a {
            color: var(--accent-primary);
            text-decoration: none;
            margin: 0 15px;
            font-weight: 600;
            transition: color 0.3s;
        }
        
        .nav-links a:hover {
            color: var(--accent-secondary);
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
            color: var(--text-muted);
        }
        
        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid #ef4444;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            color: #ef4444;
        }
        
        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }
            
            table {
                font-size: 0.8rem;
            }
            
            th, td {
                padding: 8px 4px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📡 PSK Reporter Activity</h1>
        <div class="subtitle">Recent Propagation Reports</div>
        
        <div id="content">
            <div class="loading">⏳ Loading PSK Reporter data...</div>
        </div>
        
        <div class="nav-links">
            <a href="/">← Back to Dashboard</a>
            <a href="/settings">⚙️ Settings</a>
        </div>
    </div>
    
    <script>
        async function loadPSKData() {
            try {
                const response = await fetch('/api/propagation');
                const data = await response.json();
                
                if (!data.valid) {
                    showNoData();
                    return;
                }
                
                displayData(data);
            } catch (error) {
                showError('Failed to load PSK Reporter data. Please try again.');
                console.error('Error:', error);
            }
        }
        
        function displayData(data) {
            let html = `
                <div class="info-box">
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-label">Total Spots</div>
                            <div class="stat-value">${data.spotCount}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Most Active Band</div>
                            <div class="stat-value">${data.mostActiveBand}</div>
                        </div>
                        ${data.callsign ? `
                        <div class="stat-card">
                            <div class="stat-label">Callsign</div>
                            <div class="stat-value">${data.callsign}</div>
                        </div>
                        ` : ''}
                    </div>
                </div>
                
                <div class="table-container">
                    <h2 style="margin-top: 0; color: var(--accent-primary);">
                        Recent Spots ${data.callsign ? 'for ' + data.callsign : '(Top 50)'}
                    </h2>
                    <table>
                        <thead>
                            <tr>
                                <th>Time (UTC)</th>
                                <th>TX Call</th>
                                <th>RX Call</th>
                                <th>Band</th>
                                <th>Freq (MHz)</th>
                                <th>Mode</th>
                                <th>SNR</th>
                                <th>Distance</th>
                            </tr>
                        </thead>
                        <tbody id="spots-table">
            `;
            
            data.spots.forEach(spot => {
                html += `
                    <tr>
                        <td>${spot.time}</td>
                        <td class="callsign">${spot.txCall}</td>
                        <td class="callsign">${spot.rxCall}</td>
                        <td><span class="band">${spot.band}</span></td>
                        <td>${spot.freqMHz}</td>
                        <td>${spot.mode}</td>
                        <td>${spot.snr} dB</td>
                        <td>${spot.distance} km</td>
                    </tr>
                `;
            });
            
            html += `
                        </tbody>
                    </table>
                </div>
            `;
            
            document.getElementById('content').innerHTML = html;
        }
        
        function showNoData() {
            document.getElementById('content').innerHTML = `
                <div class="info-box">
                    <div class="no-data">
                        <h2>📡 No PSK Reporter Data Available</h2>
                        <p>Waiting for propagation reports...</p>
                    </div>
                </div>
            `;
        }
        
        function showError(message) {
            document.getElementById('content').innerHTML = `
                <div class="error">
                    <strong>Error:</strong> ${message}
                </div>
            `;
        }
        
        // Load data when page loads
        loadPSKData();
        
        // Refresh every 5 minutes
        setInterval(loadPSKData, 300000);
    </script>
</body>
</html>
