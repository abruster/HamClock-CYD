<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Data - HamClock</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --accent-primary: #3b82f6;
            --accent-secondary: #10b981;
            --accent-warning: #f59e0b;
            --accent-danger: #ef4444;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-color: #475569;
        }
        
        body {
            background: linear-gradient(135deg, var(--bg-primary) 0%, #1e293b 100%);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            font-size: 2.5rem;
            background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        
        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        
        .solar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .solar-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .solar-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.4);
        }
        
        .solar-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .solar-value {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .solar-value.good {
            color: var(--accent-secondary);
        }
        
        .solar-value.moderate {
            color: var(--accent-warning);
        }
        
        .solar-value.poor {
            color: var(--accent-danger);
        }
        
        .solar-unit {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        
        .info-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        
        .info-box h2 {
            color: var(--accent-primary);
            margin-top: 0;
            margin-bottom: 15px;
        }
        
        .info-box p {
            color: var(--text-secondary);
            line-height: 1.6;
            margin: 8px 0;
        }
        
        .nav-links {
            text-align: center;
            margin-top: 30px;
        }
        
        .nav-links a {
            color: var(--accent-primary);
            text-decoration: none;
            margin: 0 15px;
            font-weight: 600;
            transition: color 0.3s;
        }
        
        .nav-links a:hover {
            color: var(--accent-secondary);
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
            color: var(--text-muted);
        }
        
        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid #ef4444;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            color: #ef4444;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .solar-value {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>☀️ Solar Conditions</h1>
        <div class="subtitle">Real-time Space Weather Data</div>
        
        <div id="content">
            <div class="loading">⏳ Loading solar data...</div>
        </div>
        
        <div class="nav-links">
            <a href="/">← Back to Dashboard</a>
            <a href="/settings">⚙️ Settings</a>
        </div>
    </div>
    
    <script>
        async function loadSolarData() {
            try {
                const response = await fetch('/api/solar');
                const data = await response.json();
                
                if (!data.valid) {
                    showNoData();
                    return;
                }
                
                displayData(data);
            } catch (error) {
                showError('Failed to load solar data. Please try again.');
                console.error('Error:', error);
            }
        }
        
        function getSFIClass(sfi) {
            if (sfi >= 150) return 'good';
            if (sfi >= 100) return 'moderate';
            return 'poor';
        }
        
        function getKIndexClass(k) {
            if (k <= 2) return 'good';
            if (k <= 4) return 'moderate';
            return 'poor';
        }
        
        function getAIndexClass(a) {
            if (a <= 10) return 'good';
            if (a <= 30) return 'moderate';
            return 'poor';
        }
        
        function displayData(data) {
            const html = `
                <div class="solar-grid">
                    <div class="solar-card">
                        <div class="solar-label">Solar Flux Index</div>
                        <div class="solar-value ${getSFIClass(data.sfi)}">${data.sfi}</div>
                        <div class="solar-unit">SFU</div>
                    </div>
                    
                    <div class="solar-card">
                        <div class="solar-label">Sunspot Number</div>
                        <div class="solar-value moderate">${data.ssn}</div>
                        <div class="solar-unit">Count</div>
                    </div>
                    
                    <div class="solar-card">
                        <div class="solar-label">A-Index</div>
                        <div class="solar-value ${getAIndexClass(data.aIndex)}">${data.aIndex}</div>
                        <div class="solar-unit">Geomagnetic Activity</div>
                    </div>
                    
                    <div class="solar-card">
                        <div class="solar-label">K-Index</div>
                        <div class="solar-value ${getKIndexClass(data.kIndex)}">${data.kIndex}</div>
                        <div class="solar-unit">0-9 Scale</div>
                    </div>
                    
                    <div class="solar-card">
                        <div class="solar-label">X-Ray Flux</div>
                        <div class="solar-value moderate">${data.xray}</div>
                        <div class="solar-unit">Solar Flares</div>
                    </div>
                    
                    <div class="solar-card">
                        <div class="solar-label">Bz Component</div>
                        <div class="solar-value good">${data.bz}</div>
                        <div class="solar-unit">nT</div>
                    </div>
                </div>
                
                <div class="info-box">
                    <h2>📖 Understanding Solar Data</h2>
                    <p><strong>Solar Flux Index (SFI):</strong> Higher values (>150) indicate better HF propagation conditions. Values below 100 suggest poorer conditions.</p>
                    <p><strong>Sunspot Number (SSN):</strong> More sunspots generally mean better propagation on higher HF bands.</p>
                    <p><strong>A-Index:</strong> Measures geomagnetic activity over 24 hours. Lower is better (0-10 = quiet, 30+ = stormy).</p>
                    <p><strong>K-Index:</strong> Measures geomagnetic activity over 3 hours. Values 0-2 are quiet, 5+ indicate geomagnetic storms.</p>
                    <p><strong>X-Ray Flux:</strong> Indicates solar flare activity. Classes: A, B, C (normal), M (moderate), X (major).</p>
                    <p><strong>Bz Component:</strong> North-south component of interplanetary magnetic field. Negative values can trigger geomagnetic storms.</p>
                </div>
            `;
            
            document.getElementById('content').innerHTML = html;
        }
        
        function showNoData() {
            document.getElementById('content').innerHTML = `
                <div class="info-box">
                    <div style="text-align: center; padding: 40px;">
                        <h2>☀️ No Solar Data Available</h2>
                        <p>Waiting for space weather data...</p>
                    </div>
                </div>
            `;
        }
        
        function showError(message) {
            document.getElementById('content').innerHTML = `
                <div class="error">
                    <strong>Error:</strong> ${message}
                </div>
            `;
        }
        
        // Load data when page loads
        loadSolarData();
        
        // Refresh every 5 minutes
        setInterval(loadSolarData, 300000);
    </script>
</body>
</html>
