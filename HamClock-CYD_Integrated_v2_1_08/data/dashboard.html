<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HamClock Dashboard</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --accent-primary: #3b82f6;
            --accent-secondary: #10b981;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-color: #475569;
        }
        
        body {
            background: linear-gradient(135deg, var(--bg-primary) 0%, #1e293b 100%);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }
        
        .callsign {
            font-size: 1.5rem;
            color: var(--accent-secondary);
            font-weight: 700;
            margin-top: 10px;
        }
        
        .time-display {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        
        .time-box {
            text-align: center;
        }
        
        .time-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .time-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent-primary);
            font-family: 'Courier New', monospace;
        }
        
        .quick-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            text-align: center;
            transition: transform 0.2s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .stat-label {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 8px;
        }
        
        .stat-value {
            color: var(--accent-primary);
            font-size: 1.5rem;
            font-weight: 700;
        }
        
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .nav-card {
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            text-decoration: none;
            color: var(--text-primary);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
        }
        
        .nav-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-primary);
            box-shadow: 0 8px 12px rgba(59, 130, 246, 0.3);
        }
        
        .nav-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        
        .nav-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent-primary);
            margin-bottom: 8px;
        }
        
        .nav-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        
        .settings-link {
            text-align: center;
            margin-top: 30px;
        }
        
        .settings-link a {
            color: var(--accent-secondary);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: color 0.3s;
        }
        
        .settings-link a:hover {
            color: var(--accent-primary);
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
            color: var(--text-muted);
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .time-display {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .time-value {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📻 HamClock</h1>
            <div class="callsign" id="callsign">Loading...</div>
        </div>
        
        <div class="time-display">
            <div class="time-box">
                <div class="time-label">Local Time</div>
                <div class="time-value" id="local-time">--:--:--</div>
            </div>
            <div class="time-box">
                <div class="time-label">UTC Time</div>
                <div class="time-value" id="utc-time">--:--:--</div>
            </div>
        </div>
        
        <div class="quick-stats" id="quick-stats">
            <div class="loading">⏳ Loading data...</div>
        </div>
        
        <div class="nav-grid">
            <a href="/status" class="nav-card">
                <div class="nav-icon">⚙️</div>
                <div class="nav-title">System Status</div>
                <div class="nav-desc">WiFi, uptime, and system info</div>
            </a>
            
            <a href="/solar" class="nav-card">
                <div class="nav-icon">☀️</div>
                <div class="nav-title">Solar Conditions</div>
                <div class="nav-desc">SFI, K-Index, and space weather</div>
            </a>
            
            <a href="/propagation" class="nav-card">
                <div class="nav-icon">📡</div>
                <div class="nav-title">Propagation</div>
                <div class="nav-desc">PSK Reporter activity and spots</div>
            </a>
            
            <a href="/iss-passes" class="nav-card">
                <div class="nav-icon">🛰️</div>
                <div class="nav-title">ISS Passes</div>
                <div class="nav-desc">Upcoming visible pass predictions</div>
            </a>
        </div>
        
        <div class="settings-link">
            <a href="/settings">⚙️ Configuration & Settings</a>
        </div>
    </div>
    
    <script>
        async function loadDashboard() {
            try {
                const response = await fetch('/api/dashboard');
                const data = await response.json();
                
                // Update times
                document.getElementById('local-time').textContent = data.time.local;
                document.getElementById('utc-time').textContent = data.time.utc;
                
                // Update callsign
                document.getElementById('callsign').textContent = 
                    data.stats.callsign || 'No Callsign Set';
                
                // Build quick stats
                let statsHtml = '';
                
                // ISS Position
                if (data.stats.issLat !== undefined) {
                    statsHtml += `
                        <div class="stat-card">
                            <div class="stat-icon">🛰️</div>
                            <div class="stat-label">ISS Position</div>
                            <div class="stat-value">${data.stats.issLat.toFixed(1)}°, ${data.stats.issLon.toFixed(1)}°</div>
                        </div>
                    `;
                }
                
                // Solar Flux
                if (data.stats.sfi !== undefined) {
                    statsHtml += `
                        <div class="stat-card">
                            <div class="stat-icon">☀️</div>
                            <div class="stat-label">Solar Flux</div>
                            <div class="stat-value">${data.stats.sfi} SFU</div>
                        </div>
                    `;
                }
                
                // K-Index
                if (data.stats.kIndex !== undefined) {
                    statsHtml += `
                        <div class="stat-card">
                            <div class="stat-icon">🌍</div>
                            <div class="stat-label">K-Index</div>
                            <div class="stat-value">${data.stats.kIndex}</div>
                        </div>
                    `;
                }
                
                // Weather
                if (data.stats.temp !== undefined) {
                    statsHtml += `
                        <div class="stat-card">
                            <div class="stat-icon">🌡️</div>
                            <div class="stat-label">Temperature</div>
                            <div class="stat-value">${data.stats.temp.toFixed(1)}°F</div>
                        </div>
                    `;
                }
                
                // PSK Spots
                if (data.stats.pskSpots !== undefined) {
                    statsHtml += `
                        <div class="stat-card">
                            <div class="stat-icon">📡</div>
                            <div class="stat-label">PSK Spots</div>
                            <div class="stat-value">${data.stats.pskSpots}</div>
                        </div>
                    `;
                }
                
                document.getElementById('quick-stats').innerHTML = statsHtml;
                
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }
        
        // Update times every second
        function updateTimes() {
            const now = new Date();
            
            // Local time
            const localTime = now.toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                hour12: true 
            });
            document.getElementById('local-time').textContent = localTime;
            
            // UTC time
            const utcTime = now.toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                hour12: false,
                timeZone: 'UTC'
            });
            document.getElementById('utc-time').textContent = utcTime + ' UTC';
        }
        
        // Load dashboard data
        loadDashboard();
        
        // Update times immediately and every second
        updateTimes();
        setInterval(updateTimes, 1000);
        
        // Refresh dashboard data every 30 seconds
        setInterval(loadDashboard, 30000);
    </script>
</body>
</html>
